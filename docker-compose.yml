services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${RCA_PG_USER:-rca}
      POSTGRES_PASSWORD: ${RCA_PG_PASSWORD:?set RCA_PG_PASSWORD in .env}
      POSTGRES_DB: ${RCA_PG_DB:-rca}
    ports:
      - "${RCA_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RCA_PG_USER:-rca}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    profiles: ["neo4j"]
    environment:
      NEO4J_AUTH: ${RCA_NEO4J_USER:-neo4j}/${RCA_NEO4J_PASSWORD:-neo4j}
      NEO4J_server_memory_heap_max__size: ${RCA_NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${RCA_NEO4J_PAGECACHE:-256m}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RCA_PG_HOST: postgres
      RCA_PG_USER: ${RCA_PG_USER:-rca}
      RCA_PG_DB: ${RCA_PG_DB:-rca}
      RCA_PG_PASSWORD: ${RCA_PG_PASSWORD:?set RCA_PG_PASSWORD in .env}
      RCA_NEO4J_URI: bolt://neo4j:7687
      RCA_NEO4J_PASSWORD: ${RCA_NEO4J_PASSWORD:-neo4j}
      RCA_TOPOLOGY_BACKEND: ${RCA_TOPOLOGY_BACKEND:-networkx}
      RCA_LLM_ENABLED: ${RCA_LLM_ENABLED:-false}
      RCA_LLM_BASE_URL: ${RCA_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      RCA_LLM_MODEL: ${RCA_LLM_MODEL:-qwen2.5:3b}
      RCA_DATA_ROOT: /data
      RCA_ARTIFACTS_ROOT: /artifacts
    volumes:
      - ./data:/data
      - ./artifacts:/artifacts
    ports:
      - "${RCA_API_PORT:-8000}:8000"

volumes:
  pgdata:
  neo4jdata:
